groups:
  - name: diary-safety
    rules:
      - alert: DiaryAuditWriteFailed
        expr: diary_audit_write_failures_total > 0
        labels:
          severity: critical
        annotations:
          summary: Diary disclosure was blocked because its access record could not be saved.
          action: Check database connectivity, storage and permissions. Confirm reads remain blocked. Investigate before restarting the worker; the counter is latched until restart.
      - alert: DiaryDoctorReadErrors
        expr: (sum(rate(http_requests_total{route="/clinician/patients/{patient_id}/entries",status=~"5.."}[5m])) / sum(rate(http_requests_total{route="/clinician/patients/{patient_id}/entries"}[5m]))) > 0.05 and sum(increase(http_requests_total{route="/clinician/patients/{patient_id}/entries"}[5m])) >= 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Doctor reads have sustained server failures above five percent.
          action: Check API health, request IDs and database health. Empty 200 responses are not failures.
      - alert: DiaryDoctorReadSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route="/clinician/patients/{patient_id}/entries"}[5m]))) > 2 and sum(increase(http_request_duration_seconds_count{route="/clinician/patients/{patient_id}/entries"}[5m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Doctor-read p95 exceeds two seconds with enough requests.
          action: Check database latency, API saturation and diary sizes. Review promptly during clinic hours.
      - alert: DiaryApiUnavailable
        expr: up{job="api"} == 0 or absent(up{job="api"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape the diary API.
          action: Check the API process, database and scrape network. Do not interpret missing traffic as healthy.
