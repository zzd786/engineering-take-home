# Only operational fields: no URL, client address, headers or upstream address.
log_format safe_operations escape=json
    '{"event":"proxy_request_completed","status":$status,'
    '"duration_seconds":"$request_time","upstream_status":"$upstream_status"}';

server {
    listen 80;
    server_tokens off;
    access_log /dev/stdout safe_operations;
    # Disable raw error logs to keep request URLs and client IPs out of logs.
    error_log /dev/null;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
